[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audalis"
version = "0.1.0"
description = "Audio control for Linux — complex underneath, stupidly simple on top."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
audalis = "audalis.ui.entry:main"
audioctl = "audalis.cli.audioctl:main"

[tool.setuptools.packages.find]
include = ["audalis*"]

[tool.setuptools.data-files]
"share/applications" = ["packaging/audalis.desktop"]
"share/icons/hicolor/scalable/apps" = ["packaging/audalis.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]